[project]
name = "inkle"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sglang-jax",
]

[project.optional-dependencies]
tpu = [
    "sglang-jax[tpu]",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
sglang-jax = { path = "engine/sglang-jax/python", editable = true }
